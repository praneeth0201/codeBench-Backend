spring.application.name=codeWithFriend


spring.datasource.url=jdbc:mysql://localhost:3306/codewithfriend
spring.datasource.username=root
spring.datasource.password=12345678


// auto update or delete or creates in mysql
spring.jpa.hibernate.ddl-auto=update

//shows sql queries in console
spring.jpa.show-sql=true 

// mentioning which language should use (here we are using mysql)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect